<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Vacinação</title>
</head>
<body>
<h1>Vacinação - <span th:text="${animal.name}"></span></h1>

<h2>Calendário vacinal</h2>
<table border="1">
    <tr>
        <th>Vacina</th>
        <th>Descrição</th>
        <th>Última aplicação</th>
        <th>Próxima dose prevista</th>
        <th>Situação</th>
        <th>Aplicada hoje?</th>
    </tr>
    <tr th:each="item : ${calendar}">
        <td th:text="${item.vaccineName}"></td>
        <td th:text="${item.description}"></td>
        <td th:text="${item.lastApplicationDate} ?: 'Nunca aplicada'"></td>
        <td th:text="${item.nextDueDate} ?: '-'"></td>
        <td th:switch="${item.calendarStatus}">
            <span th:case="'NUNCA_APLICADA'">Nunca aplicada</span>
            <span th:case="'ATRASADA'">⚠ Atrasada</span>
            <span th:case="'PROXIMA'">Próxima do vencimento</span>
            <span th:case="'EM_DIA'">Em dia</span>
            <span th:case="'DOSE_UNICA_CONCLUIDA'">Concluída (dose única)</span>
        </td>
        <td>
            <span th:if="${item.appliedToday}">✅ Realizada</span>
            <form th:if="${item.appliedToday}"
                  th:action="@{'/guardian/pet/' + ${animal.id} + '/vacinas/' + ${item.vaccineId} + '/desmarcar'}"
                  method="post" style="display:inline; margin:0;">
                <button type="submit">Desmarcar</button>
            </form>
            <form th:if="${!item.appliedToday and item.calendarStatus != 'DOSE_UNICA_CONCLUIDA'}"
                  th:action="@{'/guardian/pet/' + ${animal.id} + '/vacinas/' + ${item.vaccineId} + '/aplicar'}"
                  method="post" style="margin:0;">
                <input type="checkbox" onchange="this.form.submit()" title="Marcar como aplicada hoje">
            </form>
        </td>
    </tr>
</table>

<h2>Histórico de aplicações</h2>
<p th:if="${#lists.isEmpty(applications)}">Nenhuma vacina registrada ainda.</p>
<table th:unless="${#lists.isEmpty(applications)}" border="1">
    <tr>
        <th>Vacina</th>
        <th>Data de aplicação</th>
    </tr>
    <tr th:each="aplicacao : ${applications}">
        <td th:text="${aplicacao.vaccineName}"></td>
        <td th:text="${aplicacao.applicationDate}"></td>
    </tr>
</table>

<br><a th:href="@{/guardian/home}">Voltar</a>
</body>
</html>
