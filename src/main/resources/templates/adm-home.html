<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Painel Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sb-header">
    <div class="sb-header__logo">🐶</div>
    <p class="sb-header__title">SuperBicho · Admin</p>
    <form th:action="@{/adm/logout}" method="post" class="sb-header__logout">
        <button type="submit">Sair</button>
    </form>
</div>

<div class="sb-page">
    <p th:if="${erro}" class="sb-error" th:text="${erro}"></p>

    <h2 class="sb-section-title" style="margin-top:8px;">Clínicas pendentes de aprovação</h2>
    <p th:if="${#lists.isEmpty(clinics)}" class="sb-empty">Nenhuma clínica pendente no momento.</p>
    <div th:unless="${#lists.isEmpty(clinics)}" class="sb-table-card">
        <table>
            <tr><th>Nome</th><th>Endereço</th><th>Telefone</th><th>Email</th><th>Ações</th></tr>
            <tr th:each="clinic : ${clinics}">
                <td th:text="${clinic.name}"></td>
                <td th:text="${clinic.address}"></td>
                <td th:text="${clinic.phone}"></td>
                <td th:text="${clinic.email}"></td>
                <td>
                    <form th:action="@{/adm/approve/{id}(id=${clinic.id})}" method="post" style="display:inline">
                        <button type="submit" class="sb-btn sb-btn--blue sb-btn--sm">Aprovar</button>
                    </form>
                    <form th:action="@{/adm/deny/{id}(id=${clinic.id})}" method="post" style="display:inline">
                        <button type="submit" class="sb-btn sb-btn--danger sb-btn--sm">Recusar</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <h2 class="sb-section-title">Todas as clínicas</h2>
    <p th:if="${#lists.isEmpty(allClinics)}" class="sb-empty">Nenhuma clínica cadastrada.</p>
    <div th:unless="${#lists.isEmpty(allClinics)}" class="sb-table-card">
        <table>
            <tr><th>Nome</th><th>Email</th><th>Status</th><th>Ações</th></tr>
            <tr th:each="clinic : ${allClinics}">
                <td th:text="${clinic.name}"></td>
                <td th:text="${clinic.email}"></td>
                <td th:text="${clinic.clinicStatus}"></td>
                <td>
                    <form th:action="@{/adm/clinica/{id}/excluir(id=${clinic.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Excluir esta clínica?');">
                        <button type="submit" class="sb-btn sb-btn--danger sb-btn--sm">Excluir</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
