<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Painel Admin</title>
</head>
<body>
<p th:if="${erro}" style="color:red" th:text="${erro}"></p>

<h1>Clínicas pendentes de aprovação</h1>

<p th:if="${#lists.isEmpty(clinics)}">Nenhuma clínica pendente no momento.</p>

<table th:unless="${#lists.isEmpty(clinics)}" border="1">
    <tr>
        <th>Nome</th>
        <th>Endereço</th>
        <th>Telefone</th>
        <th>Email</th>
        <th>Ações</th>
    </tr>
    <tr th:each="clinic : ${clinics}">
        <td th:text="${clinic.name}"></td>
        <td th:text="${clinic.address}"></td>
        <td th:text="${clinic.phone}"></td>
        <td th:text="${clinic.email}"></td>
        <td>
            <form th:action="@{/adm/approve/{id}(id=${clinic.id})}" method="post" style="display:inline">
                <button type="submit">Aprovar</button>
            </form>
            <form th:action="@{/adm/deny/{id}(id=${clinic.id})}" method="post" style="display:inline">
                <button type="submit">Recusar</button>
            </form>
        </td>
    </tr>
</table>

<h1>Todas as clínicas</h1>
<p th:if="${#lists.isEmpty(allClinics)}">Nenhuma clínica cadastrada.</p>
<table th:unless="${#lists.isEmpty(allClinics)}" border="1">
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Status</th>
        <th>Ações</th>
    </tr>
    <tr th:each="clinic : ${allClinics}">
        <td th:text="${clinic.name}"></td>
        <td th:text="${clinic.email}"></td>
        <td th:text="${clinic.clinicStatus}"></td>
        <td>
            <form th:action="@{/adm/clinica/{id}/excluir(id=${clinic.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('Excluir esta clínica?');">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>

<form th:action="@{/adm/logout}" method="post">
    <button type="submit">logout</button>
</form>
</body>
</html>
