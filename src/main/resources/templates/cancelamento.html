<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Cancelar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sb-header">
    <div class="sb-header__logo">🐶</div>
    <p class="sb-header__title">SuperBicho</p>
</div>

<div class="sb-form-card">
    <h1 th:text="${title}">Cancelar</h1>

    <form th:action="@{${targetUrl}}" th:object="${cancelDTO}" method="post">
        <label class="sb-field">
            <span>Motivo do cancelamento</span>
            <textarea th:field="*{reason}" required rows="4"></textarea>
        </label>
        <p th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}" class="sb-error"></p>

        <button type="submit" class="sb-btn sb-btn--danger">Confirmar cancelamento</button>
    </form>
    <a class="sb-back-link" href="javascript:history.back()">Voltar</a>
</div>
</body>
</html>
