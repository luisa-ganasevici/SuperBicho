<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Erro</title>
</head>
<body>

<div th:if="${status == 403}">
    <h1>Acesso não permitido</h1>
    <p>Você não tem permissão para acessar esse pet.</p>
</div>

<div th:unless="${status == 403}">
    <h1>Ocorreu um erro</h1>
    <p th:text="${message}">Algo deu errado.</p>
</div>

<br><a th:href="@{/}">Voltar para a Home</a>
</body>
</html>
