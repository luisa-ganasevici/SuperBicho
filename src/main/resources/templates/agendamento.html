<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SuperBicho - Agendar Consulta</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sb-header">
    <div class="sb-header__logo">🐶</div>
    <p class="sb-header__title"><a th:href="@{/guardian/home}">SuperBicho</a></p>
</div>

<div class="sb-form-card">
  <h1>Agendar Consulta</h1>
  <form th:action="@{/guardian/agendamento}" th:object="${appointmentDTO}" method="post">
    <label class="sb-field">
      <span>Pet</span>
      <select th:field="*{animalId}">
        <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.name}"></option>
      </select>
    </label>
    <p th:if="${#fields.hasErrors('animalId')}" th:errors="*{animalId}" class="sb-error"></p>

    <label class="sb-field">
      <span>Clínica</span>
      <select id="clinicSelect" th:field="*{clinicId}" onchange="filterVets()">
        <option th:each="clinic : ${clinics}" th:value="${clinic.id}" th:text="${clinic.name}"></option>
      </select>
    </label>
    <p th:if="${#fields.hasErrors('clinicId')}" th:errors="*{clinicId}" class="sb-error"></p>

    <label class="sb-field">
      <span>Veterinário (opcional)</span>
      <select id="vetSelect" th:field="*{veterinarianId}">
        <option value="">Nenhum em especial</option>
        <option th:each="vet : ${veterinarians}" th:value="${vet.id}"
                th:text="${vet.name} + ' - ' + ${vet.specialty}"
                th:attr="data-clinic=${vet.clinicId}"></option>
      </select>
    </label>

    <label class="sb-field">
      <span>Data</span>
      <input type="date" th:field="*{date}">
    </label>
    <p th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="sb-error"></p>

    <label class="sb-field">
      <span>Horário</span>
      <input type="time" th:field="*{time}">
    </label>
    <p th:if="${#fields.hasErrors('time')}" th:errors="*{time}" class="sb-error"></p>

    <button type="submit" class="sb-btn sb-btn--orange">Agendar</button>
  </form>
  <a class="sb-back-link" th:href="@{/guardian/home}">Voltar</a>
</div>

<script th:inline="javascript">
  function filterVets() {
    var clinicId = document.getElementById('clinicSelect').value;
    var options = document.getElementById('vetSelect').options;
    for (var i = 0; i < options.length; i++) {
      var opt = options[i];
      var vetClinic = opt.getAttribute('data-clinic');
      if (vetClinic === null) { opt.hidden = false; continue; }
      opt.hidden = (vetClinic !== clinicId);
    }
  }
  document.addEventListener('DOMContentLoaded', filterVets);
</script>
</body>
</html>
