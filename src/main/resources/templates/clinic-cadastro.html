<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Cadastro Clínica</title>
</head>
<body>
<h1>Cadastro - Clínica</h1>
<form th:action="@{/clinica/cadastro}" th:object="${clinic}" method="post">
    <label>Nome da clínica:
        <input type="text" th:field="*{name}">
    </label>
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    <br>

    <label>Endereço:
        <input type="text" th:field="*{address}">
    </label>
    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
    <br>

    <label>Telefone:
        <input type="text" th:field="*{phone}">
    </label>
    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
    <br>

    <label>Email:
        <input type="text" th:field="*{email}">
    </label>
    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    <br>

    <label>Senha:
        <input type="password" th:field="*{password}">
    </label>
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    <br>

    <label>CNPJ (14 dígitos):
        <input type="text" th:field="*{cnpj}">
    </label>
    <p th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}"></p>
    <br>

    <label>Especialidades:</label><br>
    <label><input type="checkbox" th:field="*{specialties}" value="Clínica Geral"> Clínica Geral</label><br>
    <label><input type="checkbox" th:field="*{specialties}" value="Cirurgia"> Cirurgia</label><br>
    <label><input type="checkbox" th:field="*{specialties}" value="Dermatologia"> Dermatologia</label><br>
    <label><input type="checkbox" th:field="*{specialties}" value="Cardiologia"> Cardiologia</label><br>
    <label><input type="checkbox" th:field="*{specialties}" value="Odontologia"> Odontologia</label><br>
    <label><input type="checkbox" th:field="*{specialties}" value="Oftalmologia"> Oftalmologia</label><br>
    <br>

    <button type="submit">Cadastrar</button>
</form>
<br><a th:href="@{/}">Voltar para a Home</a>
</body>
</html>
