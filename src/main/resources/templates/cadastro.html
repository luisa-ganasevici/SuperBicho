<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sb-header">
    <div class="sb-header__logo">🐶</div>
    <p class="sb-header__title"><a th:href="@{/}">SuperBicho</a></p>
</div>

<div class="sb-form-card">
    <h1>Cadastro - Tutor</h1>
    <form th:action="@{/cadastro}" th:object="${guardian}" method="post">
        <label class="sb-field">
            <span>Nome</span>
            <input type="text" th:field="*{name}">
        </label>
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="sb-error"></p>

        <label class="sb-field">
            <span>Email</span>
            <input type="text" th:field="*{email}">
        </label>
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="sb-error"></p>

        <label class="sb-field">
            <span>Senha</span>
            <input type="password" th:field="*{password}">
        </label>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="sb-error"></p>

        <button type="submit" class="sb-btn sb-btn--orange">Cadastrar</button>
    </form>
    <a class="sb-btn sb-btn--outline" th:href="@{/}">Voltar para a Home</a>
</div>
</body>
</html>
