<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="sb-landing">
    <div class="sb-landing__logo">🐶</div>
    <h1>SuperBicho</h1>
    <p class="sb-tagline">Sistema de gestão veterinária.</p>

    <div class="sb-landing__group">
        <h2>Tutor</h2>
        <a class="sb-btn sb-btn--orange" th:href="@{/login}">Login</a>
        <a class="sb-btn sb-btn--outline" th:href="@{/cadastro}">Cadastrar</a>
    </div>

    <div class="sb-landing__group">
        <h2>Clínica</h2>
        <a class="sb-btn sb-btn--blue" th:href="@{/clinica/login}">Login</a>
        <a class="sb-btn sb-btn--outline" th:href="@{/clinica/cadastro}">Cadastrar</a>
    </div>

    <div class="sb-landing__group">
        <h2>Administrador</h2>
        <a class="sb-btn sb-btn--outline" th:href="@{/adm/login}">Login</a>
    </div>
</div>
</body>
</html>
