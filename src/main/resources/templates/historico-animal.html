<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SuperBicho - Histórico do Pet</title>
</head>
<body>
<h1>Histórico - <span th:text="${animal.name}"></span></h1>

<h2>Agendamentos</h2>
<p th:if="${#lists.isEmpty(appointments)}">Nenhum agendamento para este pet.</p>
<table th:unless="${#lists.isEmpty(appointments)}" border="1">
    <tr>
        <th>Clínica</th>
        <th>Data</th>
        <th>Horário</th>
        <th>Status</th>
        <th>Motivo do cancelamento</th>
    </tr>
    <tr th:each="appointment : ${appointments}">
        <td th:text="${appointment.clinicName}"></td>
        <td th:text="${appointment.veterinarianName}"></td>
        <td th:text="${appointment.date}"></td>
        <td th:text="${appointment.time}"></td>
        <td th:text="${appointment.status}"></td>
        <td th:text="${appointment.cancelReason}"></td>
    </tr>
</table>

<h2>Exames</h2>
<p th:if="${#lists.isEmpty(checkUps)}">Nenhum exame para este pet.</p>
<table th:unless="${#lists.isEmpty(checkUps)}" border="1">
    <tr>
        <th>Tipo</th>
        <th>Clínica</th>
        <th>Veterinário</th>
        <th>Data</th>
        <th>Status</th>
        <th>Motivo do cancelamento</th>
    </tr>
    <tr th:each="checkUp : ${checkUps}">
        <td th:text="${checkUp.checkUpType}"></td>
        <td th:text="${checkUp.clinicName}"></td>
        <td th:text="${checkUp.checkUpDate}"></td>
        <td th:text="${checkUp.status}"></td>
        <td th:text="${checkUp.cancelReason}"></td>
    </tr>
</table>

<br><a th:href="@{/guardian/home}">Voltar</a>
</body>
</html>
